[project]
name = "importlens-mcp"
version = "0.4.0"
description = "Import-aware context for coding agents on Python repos. Feeds your agent only the files that matter, not the whole repo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matheos", email = "mathaiou.agency@gmail.com" }]
keywords = ["mcp", "claude-code", "agent", "python", "codebase", "context", "llm"]
dependencies = [
    "mcp>=1.10.0",
]

[project.scripts]
importlens-mcp = "importlens_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Matheos13/importlens-mcp"
Issues = "https://github.com/Matheos13/importlens-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
# benchmarks/agent/hidden_tests run against the benchmark target repo, not this
# package, so keep them out of the default test run.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/importlens_mcp"]
